name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: better-cave-dweller, path: build/libs/*.jar }
      - name: GeckoLib classes (for debugging)
        if: always()
        run: |
          J=$(find ~/.gradle -name "geckolib-fabric*.jar" ! -name "*sources*" | head -1)
          echo "JAR=$J"
          unzip -l "$J" | grep -E "AutoGlowingGeoLayer|PlayState|AnimationTest|GeoEntityRenderer" || true
